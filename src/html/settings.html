<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title data-i18n="settings_title"></title>
    <style>
        body.building > * {
            display: none !important;
        }
    </style>
</head>

<body class="building">
<header>
    <div>
        <div id="logo"><span></span></div>

        <menu id="tabs">
            <li data-name="overview">
                <a data-i18n="settings_tab_overview"></a>
            </li>
            <li data-name="settings">
                <a data-i18n="settings_title"></a>
            </li>
            <li data-name="appearance">
                <a data-i18n="settings_tab_appearance"></a>
            </li>
            <li data-name="newtab">
                <a data-i18n="settings_tab_newtab"></a>
            </li>
        </menu>

        <menu id="actions">
            <li>
                <a class="btn primary" id="save" data-i18n="settings_save"></a>
            </li>
        </menu>
    </div>
</header>

<main>

    <section data-name="overview" class="tab">

        <section class="wrapper variant6">
            <div class="cols" data-cols="3">
                <div class="col">
                    <div class="formElement" data-type="language" data-name="language" data-label="large" data-i18n="settings_language" data-no-restore-button="1"></div>

                    <div class="translation-cta">
                        <strong data-i18n="settings_translation_cta_headline"></strong>
                        <p data-i18n="settings_translation_cta_desc"></p>
                        <a href="#" class="btn icon translate" data-i18n="settings_translation_cta_link"></a>
                    </div>
                </div>

                <div class="col teaser" data-usertype="free">
                    <label class="large" data-i18n="premium_title"></label>
                    <img loading="lazy"
                         src="/img/settings/premium.png"
                         alt="" data-i18nAlt="premium_title"/>
                    <div>
                        <p data-i18n="premium_desc"></p>
                        <p data-i18n="premium_desc_teaser"></p>
                        <a href="#" class="premium-info btn" data-i18n="more_link"></a>
                    </div>
                </div>

                <div class="col teaser" data-usertype="premium">
                    <label class="large" data-i18n="premium_title"></label>
                    <img loading="lazy"
                         src="/img/settings/premium.png"
                         alt="" data-i18nAlt="premium_title"/>
                    <div>
                        <p class="premium-active" data-i18n="premium_already_activated"></p>
                        <p data-i18n="premium_desc_teaser_active"></p>
                        <a href="#" class="premium-info btn" data-i18n="more_link"></a>
                    </div>
                </div>


                <div class="col teaser">
                    <label class="large" data-i18n="settings_knowledgebase"></label>
                    <img loading="lazy"
                         src="/img/settings/knowledgebase.png"
                         alt="" data-i18nAlt="settings_knowledgebase"/>
                    <div>
                        <p data-i18n="settings_knowledgebase_desc"></p>
                        <a href="#" class="knowledgebase-link btn" data-i18n="settings_knowledgebase_link"></a>
                    </div>
                </div>

                <div class="col teaser">
                    <label class="large" data-i18n="settings_support"></label>
                    <img loading="lazy"
                         src="/img/settings/support.png"
                         alt="" data-i18nAlt="settings_support"/>
                    <div>
                        <p data-i18n="settings_support_desc"></p>
                        <a href="#" class="support-link btn" data-i18n="settings_support"></a>
                    </div>
                </div>

                <div class="col teaser">
                    <label class="large" data-i18n="settings_share_info"></label>
                    <img loading="lazy"
                         src="/img/settings/stats.png"
                         alt="" data-i18nAlt="settings_share_info"/>
                    <div>
                        <p data-i18n="settings_share_info_desc"></p>
                        <a href="#" class="share-link btn" data-i18n="more_link"></a>
                    </div>
                </div>

                <div class="col info-links">
                    <ul>
                        <li><a href="#" data-name="permissions" data-i18n="settings_info_permissions"></a></li>
                        <li><a href="#" data-name="privacyPolicy" data-i18n="settings_info_privacy"></a></li>
                        <li>
                            <a href="#" data-name="changelog">
                                <span data-i18n="extension_version"></span> <span class="version"></span>
                                <span class="last-update"></span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="col info-links small">
                    <ul>
                        <li><a href="#" data-name="importExport" data-i18n="settings_import_export"></a></li>
                    </ul>
                </div>

                <div class="col info-links small">
                    <ul>
                        <li><a href="#" data-name="expert" data-i18n="settings_expert"></a></li>
                    </ul>
                </div>
            </div>
        </section>


        <section class="wrapper variant7">
            <strong>
                <span data-i18n="settings_tips_tricks_facts"></span>
                <a class="btn primary next" data-i18n="settings_tips_tricks_next"></a>
            </strong>

            <div class="cols">
                <div class="col full tips-tricks"></div>
            </div>
        </section>
    </section>

    <section data-name="settings" class="tab">
        <section class="wrapper variant1 mode-selection">
            <strong>
                <span data-i18n="settings_mode_headline"></span>

                <a class="btn primary" data-type="mode" data-value="both" data-notmode="both" data-premium-feature="bothModes" data-i18n="settings_mode_use_both"></a>

                <div class="hidden">
                    <div class="formElement" data-type="select" data-name="mode" data-config="b/mode">
                        <span data-value="overlay"></span>
                        <span data-value="sidepanel"></span>
                        <span data-value="both"></span>
                    </div>
                </div>
            </strong>

            <div class="cols">
                <div class="col mode" data-name="overlay">
                    <div class="left">
                        <img loading="lazy"
                             src="/img/settings/mode-overlay.png"
                             alt="" data-i18nAlt="settings_mode_overlay"/>
                        <a class="btn icon video" data-video="overlay-mode-chrome" data-video-title="settings_mode_overlay" data-i18n="settings_example"></a>
                        <a class="btn icon external" data-i18n="settings_details"></a>
                        <p data-mode="sidepanel">
                            <a class="btn primary" data-type="mode" data-value="overlay" data-i18n="settings_mode_use"></a>
                        </p>
                        <p data-mode="overlay" data-notmode="both">
                            <a class="btn selected" data-i18n="settings_currently_selected"></a>
                        </p>
                    </div>
                    <div class="right">
                        <strong class="title" data-i18n="settings_mode_overlay"></strong>
                        <p data-i18n="settings_mode_overlay_desc"></p>

                        <div class="pro-cons">
                            <ul>
                                <li data-i18n="settings_mode_overlay_pro_1"></li>
                                <li data-i18n="settings_mode_overlay_pro_2"></li>
                            </ul>
                            <ul>
                                <li data-i18n="settings_mode_overlay_con_1"></li>
                                <li data-i18n="settings_mode_overlay_con_2"></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col mode" data-name="sidepanel">

                    <div class="left">
                        <img loading="lazy"
                             src="/img/settings/mode-sidepanel.png"
                             alt="" data-i18nAlt="settings_mode_sidepanel"/>
                        <a class="btn icon video" data-video="sidepanel-mode-chrome" data-video-title="settings_mode_sidepanel" data-i18n="settings_example"></a>
                        <a class="btn icon external" data-i18n="settings_details"></a>
                        <p data-mode="overlay">
                            <a class="btn primary" data-type="mode" data-value="sidepanel" data-i18n="settings_mode_use"></a>
                        </p>
                        <p data-mode="sidepanel" data-notmode="both">
                            <a class="btn selected" data-i18n="settings_currently_selected"></a>
                        </p>
                    </div>
                    <div class="right">
                        <strong class="title" data-i18n="settings_mode_sidepanel"></strong>
                        <p data-i18n="settings_mode_sidepanel_desc"></p>

                        <div class="pro-cons">
                            <ul>
                                <li data-i18n="settings_mode_sidepanel_pro_1"></li>
                                <li data-i18n="settings_mode_sidepanel_pro_2"></li>
                            </ul>
                            <ul>
                                <li data-i18n="settings_mode_sidepanel_con_1"></li>
                                <li data-i18n="settings_mode_sidepanel_con_2"></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col both-info" data-mode="both">
                    <p data-i18n="settings_mode_both_desc_1"></p>

                    <p class="mt-2" data-i18n="settings_mode_both_desc_2"></p>
                </div>
            </div>
        </section>

        <section class="wrapper variant4">
            <strong data-i18n="settings_general"></strong>

            <div class="cols">
                <div class="col">
                    <div class="formElement" data-label="large" data-type="select" data-name="rememberState" data-config="b/rememberState" data-i18n="settings_remember_state">
                        <span data-value="openStatesAndPos" data-i18n="settings_remember_state_open_states_and_scroll"></span>
                        <span data-value="all" data-i18n="settings_remember_state_all"></span>
                        <span data-value="openStates" data-i18n="settings_remember_state_open_states"></span>
                        <span data-value="openStatesRoot" data-i18n="settings_remember_state_open_states_root"></span>
                        <span data-value="nothing" data-i18n="settings_remember_state_nothing"></span>
                    </div>

                    <div class="sub">
                        <div class="formElement" data-type="checkbox" data-config="b/rememberOpenStatesSubDirectories"
                             data-name="rememberOpenStatesSubDirectories"></div>
                        <label data-i18n="settings_remember_open_states_sub_directories"></label>
                    </div>

                    <p class="desc" data-i18n="settings_remember_desc"></p>
                </div>
                <div class="col" data-mode="overlay">
                      <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="select" data-name="sidebarPosition"
                         data-config="b/sidebarPosition"
                         data-no-restore-button="1"
                         data-i18n="settings_sidebar_position">
                        <span data-value="left" data-i18n="settings_sidebar_position_left"></span>
                        <span data-value="right" data-i18n="settings_sidebar_position_right"></span>
                    </div>
                    <p data-mode="both" class="note" data-i18n="settings_sidebar_position_note_overlay"></p>
                </div>
                <div class="col">
                    <div class="formElement" data-label="large" data-type="checkbox" data-name="dirAccordion"
                         data-config="b/dirAccordion" data-video="option-dirAccordion"
                         data-i18n="settings_dir_accordion"></div>
                </div>
                <div class="col" data-mode="sidepanel">
                    <span class="mode-info" data-i18n="settings_mode_sidepanel" data-i18nTitle="settings_mode_info_sidepanel"></span>

                    <label class="large" data-i18n="settings_sidebar_position"></label>
                    <a class="btn my-2 sidepanel-position" data-i18n="settings_sidepanel_position_configure"></a>

                    <p data-mode="both" class="note" data-i18n="settings_sidebar_position_note_sidepanel"></p>
                </div>
                <div class="col" data-mode="overlay">
                    <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="range" data-name="closeTimeout"
                         data-config="b/closeTimeout" data-min="0"
                         data-max="5"
                         data-infinity="1" data-step="0.25" data-unit="s" data-i18n="settings_close_timeout"></div>
                </div>
            </div>
        </section>

        <section class="wrapper variant7 trigger-area" data-mode="overlay">
            <strong data-i18n="settings_trigger_area"></strong>
            <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>

            <section class="aside-wrapper">
                <aside class="trigger-area-preview">
                    <div>
                        <div class="indicator"><span></span></div>
                        <div class="trigger-area"></div>
                        <span data-i18n="settings_trigger_area_drag_desc"></span>
                    </div>
                </aside>

                <div class="cols">
                    <div class="col">
                        <div class="formElement" data-label="large" data-type="select" data-name="openAction"
                             data-config="b/openAction"
                             data-i18n="settings_open_action">
                            <span data-value="mousedown" data-i18n="settings_open_action_leftclick"></span>
                            <span data-value="contextmenu" data-i18n="settings_open_action_rightclick"></span>
                            <span data-value="mousemove" data-i18n="settings_open_action_mouseover"></span>
                            <span data-value="icon" data-i18n="settings_open_action_icon"></span>
                        </div>
                    </div>

                    <div class="col">
                        <div class="formElement" data-label="large" data-type="range" data-name="triggerHeight"
                             data-config="b/triggerHeight"
                             data-min="5"
                             data-max="100" data-unit="%"
                             data-i18n="settings_trigger_height"></div>
                    </div>

                    <div class="col indicator-options">
                        <label class="large" data-i18n="settings_indicator"></label>
                        <p data-i18n="settings_indicator_desc"></p>

                        <div class="formElement" data-label="mt-3" data-type="range" data-name="indicatorWidth"
                             data-config="a/styles/indicatorWidth"
                             data-min="0"
                             data-max="90" data-unit="px"
                             data-i18n="settings_indicator_width"></div>

                        <div class="formElement" data-label="mt-4" data-type="color" data-name="indicatorColor"
                             data-config="a/styles/indicatorColor"
                             data-alpha="1"
                             data-i18n="settings_indicator_color"></div>
                    </div>

                    <div class="col">
                        <div class="formElement" data-label="large" data-type="range" data-name="triggerWidth"
                             data-config="b/triggerWidth"
                             data-min="1"
                             data-max="50" data-unit="px"
                             data-i18n="settings_trigger_width"></div>

                        <div class="formElement" data-label="mt-4" data-type="range" data-name="triggerWidthWindowed"
                             data-config="b/triggerWidthWindowed"
                             data-min="1"
                             data-max="90"
                             data-unit="px" data-i18n="settings_trigger_width_windowed"></div>
                    </div>

                    <div class="col indicator-options">
                        <label class="large" data-i18n="settings_indicator_icon"></label>

                        <div class="formElement" data-label="mt-3" data-type="range" data-name="indicatorIconSize"
                             data-config="a/styles/indicatorIconSize"
                             data-min="0"
                             data-max="72" data-unit="px"
                             data-i18n="settings_indicator_icon_size"></div>
                        <div class="formElement" data-label="mt-2" data-type="color" data-name="indicatorIconColor"
                             data-config="a/styles/indicatorIconColor"
                             data-alpha="1"
                             data-i18n="settings_indicator_icon_color"></div>
                    </div>

                    <div class="hidden">
                        <div class="formElement" data-type="range" data-name="triggerOffsetTop"
                             data-config="b/triggerOffsetTop" data-min="0"
                             data-step="0.1"
                             data-max="100" data-unit="%"></div>
                    </div>
                </div>
            </section>
        </section>

        <section class="wrapper variant3">
            <strong data-i18n="settings_extension_icon"></strong>

            <div class="cols">
                <div class="col">
                    <div class="extension-icon-preview">
                        <canvas width="128" height="128"></canvas>
                    </div>
                    <p data-i18n="settings_extension_icon_hidden"></p>
                    <p><span data-i18n="settings_extension_icon_hidden_howto"></span> <a class="btn icon video" data-video="pin-extension-icon-chrome" data-video-title="settings_extension_icon" data-i18n="settings_details"></a></p>
                </div>

                <div class="col">
                    <label class="large" data-i18n="settings_keyboard_shortcut"></label>
                    <a class="btn my-2 keyboard-shortcut" data-i18n="settings_keyboard_shortcut_button"></a>
                    <p data-i18n="settings_keyboard_shortcut_desc"></p>
                </div>

                <div class="col icon-selector">
                    <div class="formElement" data-label="large" data-type="radio" data-name="iconShape"
                         data-config="a/styles/iconShape"
                         data-i18n="settings_icon_shape">
                        <span data-value="bookmark"><span class="base64-icon"></span></span>
                        <span data-value="star"><span class="base64-icon"></span></span>
                        <span data-value="bookmark-filled"><span class="base64-icon"></span></span>
                        <span data-value="star-filled"><span class="base64-icon"></span></span>
                    </div>
                </div>

                <div class="col extension-icon-color">
                    <div class="formElement" data-label="large" data-type="select" data-i18n="settings_icon_color"
                         data-name="iconColorType" data-no-restore-button="1">
                        <span data-value="custom" data-i18n="settings_icon_color_custom"></span>
                        <span data-value="auto" data-i18n="settings_icon_color_auto"></span>
                    </div>
                    <span class="custom-color">
                        <div class="formElement" data-type="color"
                             data-suggestions='["#c8c8c8","#555555"]'
                             data-name="iconColor" data-config="a/styles/iconColor"></div>
                    </span>

                    <p class="desc" data-i18n="settings_icon_color_desc_1"></p>
                    <p class="note" data-i18n="settings_icon_color_desc_2"></p>
                </div>
            </div>
        </section>

        <section class="wrapper">
            <strong data-i18n="settings_advanced"></strong>

            <div class="cols">

                <div class="col">
                    <div class="formElement" data-label="large" data-type="select" data-name="linkAction"
                         data-config="b/linkAction"
                         data-i18n="settings_link_action">
                        <span data-value="current" data-i18n="settings_link_action_current_tab"></span>
                        <span data-value="newtab" data-i18n="settings_link_action_new_tab"></span>
                    </div>
                </div>

                <div class="col">
                    <div class="formElement" data-label="large" data-type="select" data-name="newTab"
                         data-config="b/newTab"
                         data-i18n="settings_new_tab">
                        <span data-value="foreground" data-i18n="settings_new_tab_foreground"></span>
                        <span data-value="background" data-i18n="settings_new_tab_background"></span>
                    </div>
                    <div class="formElement" data-label="large" data-type="select" data-name="newTabPosition"
                         data-config="b/newTabPosition">
                                <span data-value="afterCurrent"
                                      data-i18n="settings_new_tab_position_after_current"></span>
                        <span data-value="afterLast" data-i18n="settings_new_tab_position_after_last"></span>
                        <span data-value="beforeFirst"
                              data-i18n="settings_new_tab_position_before_first"></span>
                    </div>
                </div>

                <div class="col">
                    <div class="formElement" data-label="large" data-type="range" data-name="scrollBarHide"
                         data-config="b/scrollBarHide"
                         data-min="0.5"
                         data-max="5"
                         data-step="0.5" data-infinity="1" data-unit="s"
                         data-i18n="settings_scroll_bar_hide"></div>
                </div>

                <div class="col" data-premium-hidden="lockPinned">
                    <label class="large" data-i18n="settings_lock_pinned"></label>
                    <div class="formElement" data-type="checkbox" data-name="lockPinned"
                         data-config="b/lockPinned"></div>
                    <p class="desc" data-i18n="settings_lock_pinned_desc"></p>
                </div>

                <div class="col" data-mode="overlay">
                    <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="range" data-name="openDelay"
                         data-config="b/openDelay" data-min="0"
                         data-max="2"
                         data-step="0.1" data-unit="s" data-i18n="settings_open_delay"></div>
                </div>

                <div class="col" data-mode="overlay">
                    <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="checkbox" data-name="preventPageScroll"
                         data-config="b/preventPageScroll"
                         data-i18n="settings_prevent_page_scroll"></div>
                </div>

                <div class="col" data-mode="overlay">
                    <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="checkbox" data-name="preventWindowed"
                         data-config="b/preventWindowed"
                         data-i18n="settings_prevent_windowed"></div>
                </div>

                <div class="col full" data-mode="overlay">
                    <span class="mode-info" data-i18n="settings_mode_overlay" data-i18nTitle="settings_mode_info_overlay"></span>
                    <div class="formElement" data-label="large" data-type="select" data-name="visibility"
                         data-config="b/visibility"
                         data-i18n="settings_visibility">
                        <span data-value="always" data-i18n="settings_visibility_always"></span>
                        <span data-value="blacklist" data-i18n="settings_visibility_blacklist"></span>
                        <span data-value="whitelist" data-i18n="settings_visibility_whitelist"></span>
                    </div>


                    <div class="visibility-rules cols">
                        <div class="col">
                            <div class="formElement" data-type="textarea" data-name="visibilityFilter"
                                 data-i18n="settings_visibility_rules"></div>
                        </div>
                        <div class="col">
                            <ul class="bullet-list">
                                <li data-i18n="settings_visibility_rules_explanation_1"></li>
                                <li data-i18n="settings_visibility_rules_explanation_2"></li>
                                <li data-i18n="settings_visibility_rules_explanation_3"></li>
                                <li data-i18n="settings_visibility_rules_explanation_4"></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <section data-name="appearance" class="tab">
        <section class="wrapper variant5 theme-selection">
            <strong>
                <span data-i18n="settings_theme"></span>
                <div class="hidden">
                    <div class="formElement" data-type="select" data-name="theme" data-config="a/theme">
                        <span data-value="default"></span>
                        <span data-value="soft"></span>
                        <span data-value="glass"></span>
                        <span data-value="focus"></span>
                    </div>
                </div>
            </strong>

            <div class="cols" data-cols="4">
                <div class="col">
                    <div class="title">
                        <label class="large" data-i18n="settings_theme_default"></label>
                        <a class="btn icon video" data-video="theme-default" data-video-title="settings_theme_default" data-i18n="settings_example"></a>
                    </div>
                    <img loading="lazy"
                         src="/img/settings/theme-default.jpg"
                         alt="" data-i18nAlt="settings_theme_default"/>
                    <p class="desc" data-i18n="settings_theme_default_desc"></p>
                    <p data-nottheme="default">
                        <a class="btn primary" data-type="theme" data-value="default" data-i18n="settings_theme_use"></a>
                    </p>
                    <p data-theme="default">
                        <a class="btn selected" data-i18n="settings_currently_selected"></a>
                    </p>
                </div>
                <div class="col">
                    <div class="title">
                        <label class="large" data-i18n="settings_theme_soft"></label>
                        <a class="btn icon video" data-video="theme-soft" data-video-title="settings_theme_soft" data-i18n="settings_example"></a>
                    </div>
                    <img loading="lazy"
                         src="/img/settings/theme-soft.jpg"
                         alt="" data-i18nAlt="settings_theme_soft"/>
                    <p class="desc" data-i18n="settings_theme_soft_desc"></p>
                    <p data-nottheme="soft">
                        <a class="btn primary" data-type="theme" data-value="soft" data-premium-feature="themes" data-i18n="settings_theme_use"></a>
                    </p>
                    <p data-theme="soft">
                        <a class="btn selected" data-i18n="settings_currently_selected"></a>
                    </p>
                </div>
                <div class="col" data-notmode="sidepanel">
                    <div class="title">
